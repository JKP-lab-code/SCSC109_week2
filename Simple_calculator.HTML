<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator (+, -, *)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            padding: 20px;
        }

        .calculator {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 360px;
            padding: 24px;
        }

        .display {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
            text-align: right;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            word-break: break-all;
        }

        .history {
            color: #94a3b8;
            font-size: 0.95rem;
            min-height: 1.2rem;
        }

        .current {
            color: #f8fafc;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            outline: none;
            background: #334155;
            color: #f8fafc;
            font-size: 1.35rem;
            font-weight: 500;
            border-radius: 14px;
            padding: 18px 0;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        button:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
            background: #64748b;
        }

        .operator {
            background: #3b82f6;
            color: #ffffff;
        }

        .operator:hover {
            background: #2563eb;
        }

        .operator:active {
            background: #1d4ed8;
        }

        .action {
            background: #ef4444;
            color: #ffffff;
        }

        .action:hover {
            background: #dc2626;
        }

        .action:active {
            background: #b91c1c;
        }

        .equals {
            background: #10b981;
            color: #ffffff;
            grid-column: span 2;
        }

        .equals:hover {
            background: #059669;
        }

        .equals:active {
            background: #047857;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="history" id="history"></div>
            <div class="current" id="display">0</div>
        </div>
        <div class="buttons">
            <button class="action" onclick="clearAll()">C</button>
            <button class="action" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendOperator('*')">×</button>
            <button class="operator" onclick="appendOperator('-')">-</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button onclick="appendNumber('.')">.</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="appendNumber('0')">0</button>

            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const displayEl = document.getElementById('display');
        const historyEl = document.getElementById('history');

        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;

        function updateDisplay() {
            displayEl.textContent = currentInput;
            if (operator && previousInput !== '') {
                const opSymbol = operator === '*' ? '×' : operator;
                historyEl.textContent = `${previousInput} ${opSymbol}`;
            } else {
                historyEl.textContent = '';
            }
        }

        function appendNumber(num) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = num === '.' ? '0.' : num;
                shouldResetDisplay = false;
            } else {
                if (num === '.' && currentInput.includes('.')) return;
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (operator !== null && !shouldResetDisplay) {
                calculate();
            }
            previousInput = currentInput;
            operator = op;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function calculate() {
            if (operator === null || shouldResetDisplay) return;

            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            let result = 0;
            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                default: return;
            }

            result = Math.round(result * 1e12) / 1e12; // Avoid floating point inaccuracies

            const opSymbol = operator === '*' ? '×' : operator;
            historyEl.textContent = `${previousInput} ${opSymbol} ${currentInput} =`;
            currentInput = String(result);
            operator = null;
            shouldResetDisplay = true;
            displayEl.textContent = currentInput;
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLast() {
            if (shouldResetDisplay) return;
            if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            else if (e.key === '.') appendNumber('.');
            else if (e.key === '+' || e.key === '-' || e.key === '*') appendOperator(e.key);
            else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
            else if (e.key === 'Backspace') deleteLast();
            else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearAll();
        });
    </script>
</body>
</html>
